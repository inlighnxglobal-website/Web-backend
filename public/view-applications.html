<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Manager - Inlighnx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Login Section -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
                        required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
                        required>
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden"></div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition duration-300">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <!-- Navbar -->
        <nav class="bg-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">Inlighnx Application Manager</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="exportToExcel()"
                            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 font-medium text-sm">
                            <i class="fas fa-file-excel mr-1"></i> Export to Excel
                        </button>
                        <button id="logoutBtn" class="text-red-600 hover:text-red-800 font-medium">
                            <i class="fas fa-sign-out-alt mr-1"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-700">Internship Applications</h2>
                <span id="applicationCount"
                    class="bg-blue-100 text-blue-800 text-sm font-medium mr-2 px-2.5 py-0.5 rounded">0
                    Applications</span>
            </div>

            <!-- Loading State -->
            <div id="loading" class="text-center py-10 hidden">
                <i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
                <p class="mt-2 text-gray-600">Loading applications...</p>
            </div>

            <!-- Applications Table -->
            <div class="bg-white shadow-md rounded-lg overflow-hidden overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200" id="applicationsTable">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Date</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Name</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Email/Phone</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                College/State</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Details</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Role</th>
                            <th scope="col"
                                class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Element References
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const loading = document.getElementById('loading');
        const tableBody = document.getElementById('tableBody');
        const applicationCount = document.getElementById('applicationCount');

        // State
        let token = localStorage.getItem('adminToken');
        let applicationsData = [];

        // Init
        checkAuth();

        // Auth Logic
        function checkAuth() {
            if (token) {
                showDashboard();
            } else {
                showLogin();
            }
        }

        function showLogin() {
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
        }

        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchApplications();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    errorDiv.classList.add('hidden');
                    showDashboard();
                } else {
                    errorDiv.textContent = data.message || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Server error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });

        logoutBtn.addEventListener('click', () => {
            token = null;
            localStorage.removeItem('adminToken');
            showLogin();
        });

        // Data Fetching
        async function fetchApplications() {
            loading.classList.remove('hidden');
            tableBody.innerHTML = '';

            try {
                const res = await fetch(`${API_URL}/applications`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (res.status === 401) {
                    logoutBtn.click();
                    return;
                }

                const data = await res.json();

                if (data.success) {
                    applicationsData = data.data;
                    renderApplications(data.data);
                    applicationCount.textContent = `${data.count} Applications`;
                }
            } catch (error) {
                console.error('Error fetching applications:', error);
                tableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-red-500">Failed to load data.</td></tr>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderApplications(apps) {
            if (apps.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No applications found.</td></tr>';
                return;
            }

            tableBody.innerHTML = apps.map(app => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${new Date(app.createdAt).toLocaleDateString()}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${app.fullName}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${app.email}</div>
                        <div class="text-sm text-gray-500">${app.phone}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900 truncate max-w-xs" title="${app.collegeName}">${app.collegeName}</div>
                        <div class="text-sm text-gray-500">${app.state}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                            ${app.userType}
                        </span>
                        ${app.userType === 'Student' ? `<div class="text-xs text-gray-500 mt-1">Year: ${app.graduationYear}</div>` : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${app.internshipType ? app.internshipType.replace('_', ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'N/A'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button onclick="deleteApplication('${app._id}')" class="text-red-600 hover:text-red-900 transition duration-300">
                            <i class="fas fa-trash-alt"></i> Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function exportToExcel() {
            if (applicationsData.length === 0) {
                alert("No data to export");
                return;
            }

            // Prepare data for export (flatten/format if needed)
            const exportData = applicationsData.map(app => ({
                Date: new Date(app.createdAt).toLocaleDateString(),
                "Full Name": app.fullName,
                "Email": app.email,
                "Phone": app.phone,
                "College": app.collegeName,
                "State": app.state,
                "User Type": app.userType,
                "Grad Year": app.graduationYear || 'N/A',
                "Internship Role": app.internshipType,
                "Acknowledged": app.acknowledgment ? "Yes" : "No"
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Applications");
            XLSX.writeFile(wb, "Inlighnx_Applications.xlsx");
        }

        async function deleteApplication(id) {
            if (!confirm('Are you sure you want to delete this application? This action cannot be undone.')) {
                return;
            }

            try {
                const res = await fetch(`${API_URL}/applications/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();

                if (data.success) {
                    // Remove from local data array to avoid fetching again strictly necessary but good UX
                    applicationsData = applicationsData.filter(app => app._id !== id);
                    renderApplications(applicationsData);
                    applicationCount.textContent = `${applicationsData.length} Applications`;
                    alert('Application deleted successfully.');
                } else {
                    alert(data.message || 'Failed to delete application.');
                }
            } catch (error) {
                console.error('Error deleting application:', error);
                alert('An error occurred while deleting.');
            }
        }
    </script>
</body>

</html>
